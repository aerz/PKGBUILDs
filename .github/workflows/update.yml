name: aur

on:
  push:
    branches: [main]
    paths:
      - "*/*"
      - "!*/.*"
      - "*/.SRCINFO"
      - "!.github/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only detect new versions (no changes, no publishing)"
        type: boolean
        default: false

# Serialize updates and publishing together, including manual pushes.
concurrency:
  group: aur-${{ inputs.dry_run == true && 'dry-run' || 'sync' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    permissions:
      contents: write
    container:
      image: archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git python nvchecker pacman-contrib

      - name: Checkout current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Detect and update
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          extra=()
          if [[ "$DRY_RUN" == "true" ]]; then extra+=(--dry-run); fi
          runuser -u builder -- python .github/scripts/aur.py update "${extra[@]}"

      - name: Commit and push
        id: commit
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git_() { runuser -u builder -- git "$@"; }
          git_ add -- '*/PKGBUILD' '*/.SRCINFO'
          if git_ diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message=$(runuser -u builder -- python .github/scripts/aur.py commit-message)
          git_ -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$message"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          unset GH_TOKEN
          git_ push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Scheduled runs publish only when package updates were pushed.
  # Publishing reconciles all AUR packages, overwriting direct AUR changes.
  publish:
    environment: aur
    needs: update
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.dry_run != true &&
          (needs.update.result == 'success' || needs.update.result == 'skipped') &&
          (github.event_name != 'schedule' || needs.update.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git openssh python

      - name: Checkout current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      # prepare executes package PKGBUILDs in this job before AUR secrets are
      # injected. Merged package code is trusted; this is not a sandbox.
      - name: Prepare packages without credentials
        run: |
          useradd --create-home builder
          mkdir -p "$RUNNER_TEMP/aur-packages"
          chown -R builder:builder "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aur-packages"
          runuser -u builder -- python .github/scripts/aur.py prepare "$RUNNER_TEMP/aur-packages"

      - name: Publish prepared files
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: runuser -u builder -- python .github/scripts/aur.py publish "$RUNNER_TEMP/aur-packages"
