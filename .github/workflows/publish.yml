name: publish-aur

on:
  # Manual push (you editing a package and publishing it).
  push:
    branches:
      - main
    paths:
      - "*/*" # any file directly inside a package directory...
      - "!*/.*" # ...except hidden ones (.nvchecker.toml, .ci/)
      - "!*/.*/**"
  # Called by update-aur after committing the bumps: pushes made with
  # GITHUB_TOKEN don't trigger other workflows.
  workflow_call:
    inputs:
      base:
        description: "Base SHA (state before the change)"
        type: string
        required: true
      head:
        description: "SHA to publish"
        type: string
        required: true

permissions:
  contents: read

jobs:
  find-packages:
    name: Find changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.head || github.sha }}

      - name: Find changed packages
        id: find
        env:
          BASE: ${{ inputs.base || github.event.before }}
          HEAD: ${{ inputs.head || github.sha }}
        run: |
          set -euo pipefail
          packages=$(.github/scripts/find-changed-packages.sh "$BASE" "$HEAD")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  publish:
    name: "AUR: ${{ matrix.pkg }}"
    needs: find-packages
    if: ${{ needs.find-packages.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.find-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head || github.sha }}

      - name: Read package version
        id: version
        run: |
          set -eo pipefail
          source "${{ matrix.pkg }}/PKGBUILD"
          # This "upgpkg: ..." format is built the same way in update-packages.py.
          echo "message=upgpkg: ${{ matrix.pkg }} ${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ${{ matrix.pkg }}/PKGBUILD
          # Also sync the package's other non-hidden files (.install, helper
          # scripts, LICENSE...). [!.]* excludes the hidden ones (.nvchecker.toml,
          # .ci/), which stay in this repo only; the action regenerates the
          # .SRCINFO from the PKGBUILD itself.
          assets: "${{ matrix.pkg }}/[!.]*"
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.version.outputs.message }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
